[project]
name = "cc-monitor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Developer", email = "dev@example.com" }
]
requires-python = ">=3.13"
dependencies = [
    "psutil>=7.2.2",
    "ttkbootstrap>=1.20.2",
]

[project.scripts]
