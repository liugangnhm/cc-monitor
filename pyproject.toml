[project]
name = "cc-monitor"
version = "0.1.0"
description = "A GUI tool to monitor Claude Code sessions and tasks"
readme = "README.md"
authors = [
    { name = "cc-monitor", email = "cc-monitor@local" }
]
requires-python = ">=3.11"
dependencies = [
    "psutil>=7.2.2",
    "pyside6>=6.11.0",
]

[project.scripts]
cc-monitor = "cc_monitor.main:main"
cc-monitor-build = "cc_monitor.build:build"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
    "pytest>=9.0.3",
]
