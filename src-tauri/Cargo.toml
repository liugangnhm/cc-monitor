[package]
name = "cc-monitor"
version = "0.1.0"
description = "A GUI tool to monitor Claude Code sessions and tasks"
authors = ["cc-monitor"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "cc_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = ["tray-icon"] }
tauri-plugin-log = "2"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
sysinfo = "0.34"
dirs = "6.0"

